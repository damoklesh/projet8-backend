name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  checks: write
  packages: write

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20.11.0'
  TEST_RESULTS_DIR: 'test-results'

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect project type
        id: detect
        shell: bash
        run: |
          if [[ -f "gradlew" && -f "build.gradle" ]]; then
            echo "type=java" >> "$GITHUB_OUTPUT"
            echo "PROJECT_TYPE=java" >> "$GITHUB_ENV"
            echo "Spring Boot / Gradle project detected"
          elif [[ -f "package.json" && -f "angular.json" ]]; then
            echo "type=angular" >> "$GITHUB_OUTPUT"
            echo "PROJECT_TYPE=angular" >> "$GITHUB_ENV"
            echo "Angular / npm project detected"
          else
            echo "Unable to detect project type"
            exit 1
          fi

      - name: Set up Java
        if: steps.detect.outputs.type == 'java'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Node.js
        if: steps.detect.outputs.type == 'angular'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Angular dependencies
        if: steps.detect.outputs.type == 'angular'
        run: npm ci --cache .npm --prefer-offline

      - name: Run unit tests
        shell: bash
        run: |
          chmod +x ./run-tests.sh
          ./run-tests.sh

      - name: Publish test report
        if: ${{ !cancelled() && hashFiles('test-results/*.xml') != '' }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: 'test-results/*.xml'
          check_name: 'Unit Test Report'

      - name: Upload test reports
        if: ${{ !cancelled() && hashFiles('test-results/*.xml') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-test-results
          path: test-results/

  build:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker image tags
        id: image
        shell: bash
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          branch_name="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          branch_tag="${branch_name//\//-}"

          {
            echo "tags<<EOF"
            echo "${image_name}:sha-${GITHUB_SHA}"
            echo "${image_name}:${branch_tag}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Docker tags:"
          echo "- ${image_name}:sha-${GITHUB_SHA}"
          echo "- ${image_name}:${branch_tag}"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
